services:
  db:
    image: postgres:16-alpine
    container_name: cicero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lolbot
      POSTGRES_USER: lolbot
      POSTGRES_PASSWORD: lolbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lolbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./Cicero
      dockerfile: Dockerfile
    container_name: cicero-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./Cicero/.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/lolbot
      DB_USER: lolbot
      DB_PASSWORD: lolbot

volumes:
  postgres_data:
